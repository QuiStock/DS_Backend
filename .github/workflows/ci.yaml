name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  JAVA_VERSION: "26"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment

      - name: Build
        run: ./gradlew assemble

  lint-and-code-style:
    name: Lint and code style
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment

      - name: Spotless Check
        run: ./gradlew spotlessCheck

      - name: Checkstyle Check
        run: ./gradlew checkstyleMain

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-reports
          path: build/reports/checkstyle/main.*
          if-no-files-found: warn
          retention-days: 7

  code-smell:
    name: Code smell analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment

      - name: PMD analysis
        run: ./gradlew pmdMain

      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pmd-reports
          path: build/reports/pmd/main.*
          if-no-files-found: warn
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment

      - name: Run tests
        run: ./gradlew test

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: build/jacoco/test.exec
          if-no-files-found: error
          retention-days: 1

  test-coverage-validation:
    name: Test coverage validation
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup-environment

      - name: Download unit test coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-unit
          path: build/coverage-input

      - name: Generate combined coverage report
        run: ./gradlew jacocoAggregateReport --stacktrace

      - name: Validate combined coverage
        run: ./gradlew jacocoAggregateCoverageVerification --stacktrace

      - name: Upload combined JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-combined-report
          path: build/reports/jacoco/jacocoAggregateReport
          if-no-files-found: warn
          retention-days: 7
