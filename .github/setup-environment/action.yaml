name: Setup Environment
description: Sets up Java and Gradle wrapper permissions
runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
        cache: gradle

    - name: Grant execution permission to Gradle Wrapper
      run: chmod +x ./gradlew
      shell: bash

    - name: Verify Java 25 configuration
      shell: bash
      run: |
        test "$JAVA_VERSION" = "25"
        grep -Eq 'languageVersion *= *JavaLanguageVersion.of\(25\)' build.gradle
        grep -Eq 'vendor *= *JvmVendorSpec.ADOPTIUM' build.gradle
        test "$(grep -Ec '^FROM eclipse-temurin:25-(jdk|jre)-noble AS (build|runtime) Dockerfile)" = "2"
        java -version
        ./gradlew --version
