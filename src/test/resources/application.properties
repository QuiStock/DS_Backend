spring.datasource.url=jdbc:h2:mem:quistock_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
erp.sync.enabled=false

auth.jwt.issuer=https://auth.test.example
auth.jwt.jwk-set-uri=http://127.0.0.1:8090/.well-known/jwks.json
auth.jwt.audience=quistock-api

erp.api.base-url=http://localhost:8091
erp.api.products-path=/products
dashboard.short-expiry-days=30

