spring.datasource.url=jdbc:h2:mem:quistock_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
erp.sync.enabled=false

auth.jwt.issuer=https://auth.test.example
auth.jwt.jwk-set-uri=http://127.0.0.1:8090/.well-known/jwks.json
auth.jwt.audience=quistock-api

erp.api.base-url=http://localhost:8091
erp.api.products-path=/products
dashboard.short-expiry-days=30

# Public dependency readiness; do not use as liveness.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
management.health.defaults.enabled=false
app.health.timeout-ms=${HEALTH_TIMEOUT_MS:4000}
app.health.erp-required=${HEALTH_ERP_REQUIRED:true}
management.endpoint.health.cache.time-to-live=0ms
