spring.application.name=DS_Backend

# Spring Boot does not load .env files automatically. The extension hint makes
# the local .env file readable as a standard properties file when it exists.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quistock}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=existing-quistock-schema

auth.jwt.issuer=${AUTH_JWT_ISSUER:http://localhost:8090}
auth.jwt.jwk-set-uri=${AUTH_JWT_JWK_SET_URI:http://localhost:8090/.well-known/jwks.json}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:quistock-api}

erp.api.base-url=${ERP_API_BASE_URL:}
erp.api.products-path=${ERP_API_PRODUCTS_PATH:/products}
dashboard.short-expiry-days=${DASHBOARD_SHORT_EXPIRY_DAYS:30}
erp.sync.enabled=${ERP_SYNC_ENABLED:true}
erp.sync.fixed-delay-ms=${ERP_SYNC_FIXED_DELAY_MS:900000}
erp.sync.initial-delay-ms=${ERP_SYNC_INITIAL_DELAY_MS:1000}

# Public dependency readiness; do not use as liveness.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
management.health.defaults.enabled=false
app.health.timeout-ms=${HEALTH_TIMEOUT_MS:4000}
app.health.erp-required=${HEALTH_ERP_REQUIRED:true}
management.endpoint.health.cache.time-to-live=${HEALTH_CACHE_TTL:5s}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,dependencies
