spring.application.name=DS_Backend

# Spring Boot does not load .env files automatically. The extension hint makes
# the local .env file readable as a standard properties file when it exists.
spring.config.import=optional:file:.env[.properties]

server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quistock}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

erp.api.base-url=${ERP_API_BASE_URL:https://6a07e24cfa9b27c848fa5e20.mockapi.io/erpGenerico/}
erp.api.products-path=${ERP_API_PRODUCTS_PATH:/products}
